<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="remi-art">
  <title id="remi-art">Placeholder for Remi: a zoomed chat pane with a saved Friday reminder set for 18:00.</title>

  <defs>
    <pattern id="remi-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
    <radialGradient id="remi-bloom" cx="88%" cy="0%" r="74%">
      <stop offset="0%" stop-color="#cfe3ff" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#cfe3ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="#0a0a0b" />
  <rect width="1600" height="1000" fill="url(#remi-grid)" />
  <rect width="1600" height="1000" fill="url(#remi-bloom)" />

  <!-- chat header -->
  <line x1="120" y1="196" x2="1480" y2="196" stroke="#26262c" stroke-width="2" />
  <text x="120" y="150" font-family="ui-monospace, 'Geist Mono', Menlo, Consolas, monospace" font-size="52" letter-spacing="-0.5" fill="#f4f5f7">remi</text>
  <text x="1480" y="144" text-anchor="end" font-family="ui-monospace, 'Geist Mono', Menlo, Consolas, monospace" font-size="28" letter-spacing="1" fill="#7d828b">telegram reminder bot</text>

  <!-- the ask -->
  <rect x="120" y="240" width="820" height="164" rx="22" fill="#131316" stroke="#2a2a31" stroke-width="2" />
  <text x="160" y="300" font-family="ui-monospace, 'Geist Mono', Menlo, Consolas, monospace" font-size="40" letter-spacing="0" fill="#c3c7cf">remind me to send the report</text>
  <text x="160" y="356" font-family="ui-monospace, 'Geist Mono', Menlo, Consolas, monospace" font-size="40" letter-spacing="0" fill="#9096a0">every friday at 6pm</text>

  <!-- the answer -->
  <rect x="660" y="440" width="820" height="132" rx="22" fill="#171a20" stroke="#323845" stroke-width="2" />
  <text x="700" y="496" font-family="ui-monospace, 'Geist Mono', Menlo, Consolas, monospace" font-size="40" letter-spacing="0" fill="#e4e7ec">saved for friday 18:00</text>
  <text x="700" y="540" font-family="ui-monospace, 'Geist Mono', Menlo, Consolas, monospace" font-size="26" letter-spacing="1.4" fill="#7d828b">id rmd_8f31c2, next run in 4 days</text>

  <!-- the reminder -->
  <rect x="120" y="620" width="1360" height="262" rx="26" fill="#0f1013" stroke="#2c3038" stroke-width="2" />
  <text x="164" y="676" font-family="ui-monospace, 'Geist Mono', Menlo, Consolas, monospace" font-size="26" letter-spacing="4" fill="#6f747d">REMINDER</text>
  <text x="160" y="834" font-family="ui-monospace, 'Geist Mono', Menlo, Consolas, monospace" font-size="164" letter-spacing="-6" fill="#f4f5f7">18:00</text>
  <text x="1420" y="700" text-anchor="end" font-family="ui-monospace, 'Geist Mono', Menlo, Consolas, monospace" font-size="28" letter-spacing="0.6" fill="#9096a0">every friday</text>
  <text x="1420" y="746" text-anchor="end" font-family="ui-monospace, 'Geist Mono', Menlo, Consolas, monospace" font-size="28" letter-spacing="0.6" fill="#6f747d">europe/berlin</text>
  <rect x="1156" y="790" width="264" height="56" rx="28" fill="none" stroke="#3a3f49" stroke-width="2" />
  <circle cx="1192" cy="818" r="12" fill="#cfe3ff" fill-opacity="0.85" />
  <text x="1220" y="828" font-family="ui-monospace, 'Geist Mono', Menlo, Consolas, monospace" font-size="26" letter-spacing="0.6" fill="#9096a0">active</text>

  <text x="120" y="952" font-family="ui-monospace, 'Geist Mono', Menlo, Consolas, monospace" font-size="26" letter-spacing="3" fill="#5b6069">PLACEHOLDER</text>
  <text x="1480" y="952" text-anchor="end" font-family="ui-monospace, 'Geist Mono', Menlo, Consolas, monospace" font-size="26" letter-spacing="0.6" fill="#5b6069">replace with a real screenshot</text>
</svg>
